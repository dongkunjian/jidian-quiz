<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 192 192">
  <defs>
    <!-- 洋红→紫红主渐变 -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#ff5fa2"/>
      <stop offset="0.42" stop-color="#e6297f"/>
      <stop offset="0.72" stop-color="#c2147e"/>
      <stop offset="1"   stop-color="#8e1170"/>
    </linearGradient>
    <!-- 顶部紫色晕染 -->
    <radialGradient id="purple" cx="0.8" cy="0.06" r="0.75">
      <stop offset="0" stop-color="#7b2ff7" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7b2ff7" stop-opacity="0"/>
    </radialGradient>
    <!-- 玻璃高光 -->
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bottomGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ff8ec4" stop-opacity="0.5"/>
    </linearGradient>
    <clipPath id="card"><rect x="4" y="4" width="184" height="184" rx="40"/></clipPath>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#5d0a4a" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect x="4" y="4" width="184" height="184" rx="40" fill="url(#bg)"/>
  <g clip-path="url(#card)">
    <rect x="4" y="4" width="184" height="184" fill="url(#purple)"/>
    <!-- 顶部玻璃高光带 -->
    <path d="M4 4 H188 V70 C150 96 42 96 4 62 Z" fill="url(#gloss)"/>
    <!-- 底部反光 -->
    <path d="M4 150 C60 128 132 128 188 150 V188 H4 Z" fill="url(#bottomGloss)"/>
  </g>
  <rect x="4.75" y="4.75" width="182.5" height="182.5" rx="39" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="1.5"/>

  <!-- JD 字母 -->
  <g filter="url(#shadow)">
    <text x="96" y="112" text-anchor="middle" dominant-baseline="central"
          font-family="Arial Black, Arial, sans-serif" font-size="86" font-weight="900"
          letter-spacing="-4" fill="#ffffff">JD</text>
  </g>

  <!-- 齿轮细节：置于字母下方，象征机电 -->
  <g transform="translate(96,158)" fill="#ffffff" fill-opacity="0.92">
    <g id="t">
      <rect x="-2.4" y="-13" width="4.8" height="7" rx="1.2"/>
      <rect x="-2.4" y="-13" width="4.8" height="7" rx="1.2" transform="rotate(45)"/>
      <rect x="-2.4" y="-13" width="4.8" height="7" rx="1.2" transform="rotate(90)"/>
      <rect x="-2.4" y="-13" width="4.8" height="7" rx="1.2" transform="rotate(135)"/>
      <rect x="-2.4" y="-13" width="4.8" height="7" rx="1.2" transform="rotate(180)"/>
      <rect x="-2.4" y="-13" width="4.8" height="7" rx="1.2" transform="rotate(225)"/>
      <rect x="-2.4" y="-13" width="4.8" height="7" rx="1.2" transform="rotate(270)"/>
      <rect x="-2.4" y="-13" width="4.8" height="7" rx="1.2" transform="rotate(315)"/>
    </g>
    <circle r="8.5"/>
    <circle r="3.4" fill="#c2147e"/>
  </g>
</svg>
