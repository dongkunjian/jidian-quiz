<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8cff"/>
      <stop offset="0.55" stop-color="#6d6bff"/>
      <stop offset="1" stop-color="#9b5cff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbe6ff"/>
    </linearGradient>
    <linearGradient id="hole" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a4bd6"/>
      <stop offset="1" stop-color="#7a3fe0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1a1340" flood-opacity="0.45"/>
    </filter>
    <g id="teeth" fill="url(#gear)">
      <rect x="90" y="16" width="12" height="28" rx="3"/>
      <rect x="90" y="16" width="12" height="28" rx="3" transform="rotate(30 96 96)"/>
      <rect x="90" y="16" width="12" height="28" rx="3" transform="rotate(60 96 96)"/>
      <rect x="90" y="16" width="12" height="28" rx="3" transform="rotate(90 96 96)"/>
      <rect x="90" y="16" width="12" height="28" rx="3" transform="rotate(120 96 96)"/>
      <rect x="90" y="16" width="12" height="28" rx="3" transform="rotate(150 96 96)"/>
      <rect x="90" y="16" width="12" height="28" rx="3" transform="rotate(180 96 96)"/>
      <rect x="90" y="16" width="12" height="28" rx="3" transform="rotate(210 96 96)"/>
      <rect x="90" y="16" width="12" height="28" rx="3" transform="rotate(240 96 96)"/>
      <rect x="90" y="16" width="12" height="28" rx="3" transform="rotate(270 96 96)"/>
      <rect x="90" y="16" width="12" height="28" rx="3" transform="rotate(300 96 96)"/>
      <rect x="90" y="16" width="12" height="28" rx="3" transform="rotate(330 96 96)"/>
    </g>
  </defs>

  <rect width="192" height="192" fill="url(#bg)"/>
  <rect width="192" height="192" fill="url(#glow)"/>

  <g filter="url(#shadow)">
    <use href="#teeth"/>
    <circle cx="96" cy="96" r="58" fill="url(#gear)"/>
    <circle cx="96" cy="96" r="37" fill="url(#hole)"/>
    <circle cx="96" cy="96" r="37" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5"/>
  </g>

  <text x="96" y="97" text-anchor="middle" dominant-baseline="central"
        font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="52" font-weight="700"
        fill="#ffffff">机</text>

  <g fill="#ffffff" fill-opacity="0.9">
    <circle cx="96" cy="47" r="2.6"/>
    <circle cx="96" cy="145" r="2.6"/>
    <circle cx="47" cy="96" r="2.6"/>
    <circle cx="145" cy="96" r="2.6"/>
  </g>
</svg>
